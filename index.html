<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitreous</title>
<meta name="description" content="Vitreous: a private, fast, fully customizable browser with a liquid-glass interface.">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="css/vitreous.css">
<style id="userCss"></style>
</head>
<body data-theme="dark">
<div class="wall" id="wall" aria-hidden="true"></div>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">
  <div class="side-wrap" id="sideWrap" data-rail="0">
    <aside class="sidebar glass" id="sidebar" aria-label="Sidebar" data-hide-tabs="0">
      <div class="side-head">
        <img class="mark" src="assets/vitreous-mark.svg" alt="Vitreous">
        <span class="lbl brand-name">vitreous</span>
        <button class="icon-btn lbl" id="pin" title="Compact sidebar (Alt B)" aria-label="Toggle compact sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16"/></svg></button>
      </div>

      <div class="spaces" id="spaces" role="group" aria-label="Spaces"></div>

      <button class="new-tab" id="sideNewTab" title="New tab (Alt T)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">New tab</span>
      </button>

      <div class="tab-list side-list" id="sideTabs" role="tablist" aria-orientation="vertical"><div class="indicator" aria-hidden="true"></div></div>

      <div class="side-foot">
        <button class="icon-btn" id="openSettings" title="Settings (Alt ,)" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="icon-btn lbl" id="palBtn" title="Command palette (Ctrl K)" aria-label="Command palette"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></svg></button>
      </div>
    </aside>
  </div>

  <main class="main" id="main" data-tabs="side">
    <div class="tabstrip glass">
      <div class="tabs tab-list" id="tabs" role="tablist"><div class="indicator" aria-hidden="true"></div></div>
      <button class="icon-btn" id="newTab" title="New tab (Alt T)" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>

    <div class="toolbar">
      <div class="nav nav-l">
        <button class="icon-btn" id="home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></button>
        <button class="icon-btn" id="back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="icon-btn" id="forward" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="icon-btn" id="reload" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
      </div>
      <label class="address">
        <svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address bar">
        <button type="button" class="addr-clear" id="addrClear" aria-label="Clear address" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
        <button type="button" class="bm-star" id="bmStar" title="Bookmark this page (Ctrl D)" aria-label="Bookmark this page" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/></svg></button>
      </label>
      <div class="nav nav-r">
        <button class="icon-btn" id="tbSidebar" title="Toggle sidebar" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16"/></svg></button>
        <button class="icon-btn" id="tbPalette" title="Command palette" aria-label="Command palette"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></svg></button>
        <button class="icon-btn" id="tbSettings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
        <button class="icon-btn" id="shield" title="Privacy" aria-label="Privacy settings"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg></button>
      </div>
    </div>

    <div class="bmbar" id="bmbar" hidden aria-label="Bookmarks"></div>

    <div class="viewport glass" id="viewport"><div class="loadbar" id="loadbar"></div><div class="content" id="content"></div><div class="frame-guard" id="frameGuard" aria-hidden="true"></div></div>
  </main>
</div>

<div class="pal" id="pal" role="dialog" aria-label="Command palette">
  <div class="pal-box glass">
    <input id="palInput" placeholder="Type a command or tab name" autocomplete="off" spellcheck="false">
    <div class="pal-list" id="palList"></div>
  </div>
</div>
<div class="toast glass" id="toast" role="status"></div>

<script src="js/app.js"></script>
</body>
</html>
